<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShineUp - Log In</title>
    <link rel="stylesheet" href="./LogIn.css">
</head>

<body>

    <div class="login-container">

        <h1>
            ShineUp
        </h1>

        <h2>
            Welcome Back
        </h2>

        <p>
            Log in to your ShineUp account
        </p>

        <form>

            <label>
                Email
            </label>

            <input type="email" placeholder="Enter your email" required>


            <label>
                Password
            </label>

            <input type="password" placeholder="Enter your password" required>


            <button type="submit">
                Log In
            </button>

        </form>

        <p class="back">
            <a href="./index.html">
                Back to ShineUp
            </a>
        </p>

    </div>

</body>

</html>
